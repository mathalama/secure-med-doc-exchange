<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedExchange Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: product shell. Dark petrol sidebar, light work area; document view splits paper preview | verification panel. */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --surface-2: #eaf0f0;
  --ink: #13242a;
  --muted: #5a6c73;
  --faint: #8a9aa0;
  --line: #dbe4e5;
  --accent: #0b6b70;
  --accent-hover: #095a5e;
  --accent-ink: #ffffff;
  --accent-soft: #dff0ef;
  --seal: #a55a17;
  --seal-soft: #fbefe1;
  --ok: #1d7448;
  --ok-soft: #e0f2e8;
  --warn: #8f5a00;
  --warn-soft: #fff1d2;
  --bad: #b3261e;
  --bad-soft: #fde6e3;
  --info: #2a57b0;
  --info-soft: #e5ecfa;
  --side: #0e272d;
  --side-2: #163840;
  --side-ink: #c4d7d9;
  --side-muted: #7f9da2;
  --paper: #fffefb;
  --paper-ink: #1d2326;
  --shadow: 0 1px 2px rgba(16, 40, 45, .06), 0 8px 24px rgba(16, 40, 45, .08);
  --font: "Golos Text", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1e; --surface: #13242a; --surface-2: #1a2f35; --ink: #e3eeef; --muted: #9db2b7; --faint: #6f8a90;
    --line: #26414a; --accent: #4fc1bf; --accent-hover: #6fd3d0; --accent-ink: #062224; --accent-soft: #143c3e;
    --seal: #e7a764; --seal-soft: #3a2a17; --ok: #6fd39c; --ok-soft: #133525; --warn: #f0c060; --warn-soft: #3a2d10;
    --bad: #ff9b90; --bad-soft: #43201c; --info: #93b4ff; --info-soft: #1c2a4a;
    --side: #08171a; --side-2: #12292e; --side-ink: #c4d7d9; --side-muted: #6f8e93;
    --paper: #f4f1ea; --paper-ink: #1d2326; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1e; --surface: #13242a; --surface-2: #1a2f35; --ink: #e3eeef; --muted: #9db2b7; --faint: #6f8a90;
  --line: #26414a; --accent: #4fc1bf; --accent-hover: #6fd3d0; --accent-ink: #062224; --accent-soft: #143c3e;
  --seal: #e7a764; --seal-soft: #3a2a17; --ok: #6fd39c; --ok-soft: #133525; --warn: #f0c060; --warn-soft: #3a2d10;
  --bad: #ff9b90; --bad-soft: #43201c; --info: #93b4ff; --info-soft: #1c2a4a;
  --side: #08171a; --side-2: #12292e; --side-ink: #c4d7d9; --side-muted: #6f8e93;
  --paper: #f4f1ea; --paper-ink: #1d2326; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -.01em; }
a { color: var(--accent); }
.mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Buttons, inputs, pills ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.seal { background: var(--seal); border-color: var(--seal); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 500; }
.field small { color: var(--muted); font-size: 12px; }
.field small.err { color: var(--bad); }
.input { height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); width: 100%; min-width: 0; }
textarea.input { height: auto; padding: 10px 12px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); }
.input.invalid { border-color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-sent { background: var(--surface-2); color: var(--muted); }
.p-delivered { background: var(--info-soft); color: var(--info); }
.p-opened { background: var(--accent-soft); color: var(--accent); }
.p-signed { background: var(--ok-soft); color: var(--ok); }
.p-rejected, .p-revoked { background: var(--bad-soft); color: var(--bad); }
.p-expired { background: var(--warn-soft); color: var(--warn); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 500; }
.chip .n { font-size: 11px; color: var(--muted); }
.chip.on .n { color: inherit; }

/* ---------- Login ---------- */
#root { min-height: 100%; }
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.login-brand { background: var(--side); color: var(--side-ink); padding-block: 48px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; position: relative; overflow: hidden; }
.login-brand h1 { color: #fff; font-size: 32px; line-height: 1.15; max-width: 14em; }
.login-brand p { max-width: 30em; color: var(--side-ink); }
.brand-mark { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; font-size: 17px; }
.brand-mark svg { width: 30px; height: 30px; }
.login-facts { display: grid; gap: 14px; }
.login-facts div { display: flex; gap: 12px; align-items: flex-start; }
.login-facts svg { width: 20px; height: 20px; color: var(--accent); flex: none; margin-top: 2px; }
.login-facts b { color: #fff; font-weight: 500; display: block; }
.login-brand .mesh { position: absolute; right: -120px; bottom: -120px; width: 420px; height: 420px; opacity: .14; pointer-events: none; }
.login-form { display: grid; place-items: center; padding-block: 48px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 380px; display: grid; gap: 20px; }
.login-card h2 { font-size: 24px; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 9px; }
.tabs button { flex: 1; height: 34px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.otp { display: flex; gap: 8px; }
.otp input { width: 46px; height: 52px; text-align: center; font: 600 20px var(--mono); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.otp input:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: 13px; background: var(--surface-2); color: var(--muted); }
.note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.ok { background: var(--ok-soft); color: var(--ok); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.info { background: var(--info-soft); color: var(--info); }

/* ---------- App shell ---------- */
.app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 6px; padding-block: 18px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; position: sticky; top: 0; height: 100vh; }
.side .brand-mark { padding: 0 8px 14px; }
.org { display: grid; gap: 2px; padding: 10px 12px; border-radius: 8px; background: var(--side-2); margin-bottom: 10px; }
.org b { color: #fff; font-weight: 500; font-size: 13px; }
.org span { font-size: 12px; color: var(--side-muted); }
.nav-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); padding: 12px 12px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 7px; color: var(--side-ink); text-decoration: none; cursor: pointer; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: var(--side-2); color: #fff; }
.nav a.on { background: var(--side-2); color: #fff; font-weight: 500; box-shadow: inset 3px 0 0 var(--accent); }
.nav a .count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.nav a.locked { opacity: .4; pointer-events: none; }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.ncl-status { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--side-muted); padding: 8px 12px; border: 1px solid var(--side-2); border-radius: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3ccf8e; box-shadow: 0 0 0 3px rgba(60,207,142,.2); flex: none; }
.dot.off { background: #ff7b6e; box-shadow: 0 0 0 3px rgba(255,123,110,.2); }
button.ncl-status { background: transparent; cursor: pointer; text-align: left; font: inherit; font-size: 12px; color: var(--side-muted); }
button.ncl-status:hover { color: #fff; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; height: 60px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.search { flex: 1; max-width: 460px; position: relative; }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--faint); }
.search input { padding-left: 34px; background: var(--surface); }
.top .spacer { flex: 1; }
.icon-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; position: relative; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .badge { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
.me { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 4px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.me div { display: grid; line-height: 1.2; }
.me b { font-weight: 500; font-size: 13px; }
.me span { font-size: 11.5px; color: var(--muted); }
.content { padding-block: 24px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; max-width: 1280px; width: 100%; }
.content > * { min-width: 0; }
.nav { display: grid; gap: 2px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.crumbs a { color: var(--muted); text-decoration: none; cursor: pointer; }
.crumbs a:hover { color: var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h3 { font-size: 15px; }
.panel-b { padding: 18px; display: grid; gap: 16px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; color: var(--muted); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
tr.unread td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.unread .doc-title { font-weight: 600; }
.doc-cell { display: flex; gap: 12px; align-items: center; min-width: 0; }
.doc-ico { width: 34px; height: 40px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font: 600 9px var(--mono); color: var(--muted); flex: none; position: relative; }
.doc-ico::after { content: ""; position: absolute; top: -1px; right: -1px; width: 10px; height: 10px; background: linear-gradient(225deg, var(--bg) 50%, var(--line) 50%); border-radius: 0 5px 0 0; }
.doc-title { display: block; }
.doc-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
td.nw, td .nw { white-space: nowrap; }
.sig { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ok); white-space: nowrap; }
.sig svg { width: 16px; height: 16px; }
.sig.bad { color: var(--bad); }
.table-foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); gap: 12px; flex-wrap: wrap; }
.track { display: flex; align-items: center; gap: 3px; }
.track i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.track i.on { background: var(--accent); }
.track i.bad { background: var(--bad); }
.empty { padding: 48px 18px; text-align: center; color: var(--muted); }

/* ---------- Document view ---------- */
.doc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.viewer { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.viewer-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.viewer-bar .grow { flex: 1; }
.viewer-body { padding: 28px; display: grid; place-items: center; overflow-x: auto; }
.paper { width: 100%; max-width: 640px; background: var(--paper); color: var(--paper-ink); box-shadow: var(--shadow); padding: 44px 52px 52px; font-size: 12.5px; line-height: 1.6; position: relative; }
.paper .ph { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid #c9cfd1; padding-bottom: 12px; margin-bottom: 18px; font-size: 11px; color: #4b555a; }
.paper h4 { text-align: center; font-size: 14px; letter-spacing: .04em; margin: 0 0 4px; }
.paper .sub { text-align: center; color: #4b555a; margin-bottom: 18px; }
.paper dl { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; margin: 0 0 14px; }
.paper dt { color: #4b555a; }
.paper dd { margin: 0; }
.paper p { margin: 0 0 10px; text-align: justify; }
.paper .ps { margin-top: 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.stamp { border: 2px solid #2b5fb0; color: #2b5fb0; border-radius: 6px; padding: 8px 12px; font-size: 10.5px; line-height: 1.35; transform: rotate(-2deg); max-width: 250px; font-family: var(--mono); }
.stamp b { display: block; font-size: 11px; letter-spacing: .04em; }
.side-stack { display: grid; gap: 14px; position: sticky; top: 76px; }
.verify { border-radius: 10px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.verify-h { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: var(--ok-soft); color: var(--ok); }
.verify-h svg { width: 28px; height: 28px; flex: none; }
.verify-h b { display: block; font-size: 15px; }
.verify-h span { font-size: 12.5px; }
.verify-h.bad { background: var(--bad-soft); color: var(--bad); }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 12px; padding: 14px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.checks { display: grid; gap: 8px; padding: 0 16px 14px; }
.checks div { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.checks svg { width: 16px; height: 16px; color: var(--ok); flex: none; }
.timeline { display: grid; gap: 0; padding: 4px 16px 14px; }
.tl { display: grid; grid-template-columns: 18px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 8px; top: 16px; bottom: -2px; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl i { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); margin-top: 2px; z-index: 1; }
.tl.now i { background: var(--accent); }
.tl.bad i { border-color: var(--bad); background: var(--bad); }
.tl b { font-weight: 500; display: block; }
.tl span { font-size: 12.5px; color: var(--muted); }
.actions { display: grid; gap: 8px; padding: 16px; }
.actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { justify-content: center; }

/* ---------- Compose ---------- */
.steps { display: flex; gap: 0; counter-reset: s; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 10px; padding: 0 18px 0 0; color: var(--muted); font-weight: 500; }
.step::after { content: ""; width: 32px; height: 1px; background: var(--line); margin-left: 8px; }
.step:last-child::after { display: none; }
.step i { counter-increment: s; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.step i::before { content: counter(s); }
.step.on { color: var(--ink); }
.step.on i { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.step.done i { border-color: var(--accent); color: var(--accent); }
.step.done i::before { content: "✓"; }
.compose { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 26px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); background: var(--surface-2); cursor: pointer; }
.drop svg { width: 28px; height: 28px; color: var(--accent); }
.file { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.file .grow { flex: 1; min-width: 0; }
.file .hash { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.org-list { display: grid; gap: 6px; max-height: 248px; overflow: auto; }

        <div class="stat"><span>Ожидают вашей подписи</span><b>${incoming.filter((d) => d.status === "opened").length}</b><small>открыты, но не приняты</small></div>
        <div class="stat"><span>Среднее время доставки</span><b>2,4 с</b><small>включая проверку подписи</small></div>
      </div>
      <section class="panel">
        <div class="panel-h">
          <div class="toolbar">
            ${[["all", "Все"], ["new", "Новые"], ["signed", "Принятые"], ["rejected", "Отклонённые"]].map(([k, l]) => `<button class="chip ${S.filter === k ? "on" : ""}" data-filter="${k}">${l} <span class="n">${counts[k]}</span></button>`).join("")}
          </div>
          <div class="toolbar"><button class="btn sm">${I.filter} Тип: все</button><button class="btn sm">Период: 30 дней</button></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Документ</th><th>Пациент</th><th>Отправитель</th><th>ЭЦП</th><th>Получен</th><th>Статус</th></tr></thead>
          <tbody>${rows || ""}</tbody></table>
          ${rows ? "" : `<div class="empty">Ничего не найдено. Измените фильтр или поисковый запрос.</div>`}
        </div>
        <div class="table-foot"><span>Показано ${list.length} из ${incoming.length}</span><span>Документы доступны 30 дней с момента отправки</span></div>
      </section>`;
  }

  function docView() {
    const d = incoming.find((x) => x.id === S.docId);
    if (!d) return `<div class="empty">Документ не найден.</div>`;
    const o = org(d.from);
    const steps = [
      { k: "sent", t: "Подписан и отправлен", s: `${d.signer.split(" ").slice(0, 1)} ${d.signer.split(" ")[1][0]}. ${d.signer.split(" ")[2][0]}. · ${d.received}` },
      { k: "verified", t: "Подпись проверена системой", s: "OCSP НУЦ РК: good · " + d.received },
      { k: "delivered", t: "Доставлен в организацию", s: d.received },
      { k: "opened", t: "Открыт", s: d.status === "delivered" ? "—" : (d.openedNow ? "Сейчас · " + PEOPLE[S.role].short : "Садыкова А. Н.") }
    ];
    if (d.status === "signed") steps.push({ k: "signed", t: "Принят, подписан ЭЦП получателя", s: d.acceptedNow ? "Сейчас · " + PEOPLE[S.role].short : "Садыкова А. Н. · 21.10.2026 12:03" });
    if (d.status === "rejected") steps.push({ k: "rejected", t: "Отклонён", s: d.reason, bad: true });
    const final = d.status === "signed" || d.status === "rejected";
    return `
      <div class="page-head">
        <div style="display:grid;gap:6px">
          <div class="crumbs"><a data-go="inbox">Входящие</a><span>/</span><span class="mono">${d.id}</span></div>
          <h1>${esc(d.title)}</h1>
          <div class="toolbar">${pill(d.status)}<span class="muted">${d.type} · от ${esc(o.name)}</span></div>
        </div>
        <div class="toolbar">
          <button class="btn" data-a="dl" data-what="PDF">${I.download} PDF</button>
          <button class="btn" data-a="dl" data-what="CMS-подпись (.cms)">${I.pen} Подпись</button>
          <button class="btn" data-a="dl" data-what="FHIR DocumentReference (.json)">FHIR</button>
        </div>
      </div>
      <div class="doc-layout">
        <section class="viewer">
          <div class="viewer-bar"><span>${I.file}</span><span class="grow">${d.id}.pdf · ${d.size} · ${d.pages} стр.</span><span>Стр. 1 из ${d.pages}</span><button class="btn sm ghost">−</button><span>100%</span><button class="btn sm ghost">+</button></div>
          <div class="viewer-body">${paper(d, o)}</div>
        </section>
        <aside class="side-stack">
          <section class="verify">
            <div class="verify-h">${I.shield}<div><b>Подпись действительна</b><span>Документ не изменялся после подписания</span></div></div>
            <dl class="kv">
              <dt>Подписант</dt><dd>${esc(d.signer)}</dd>
              <dt>Должность</dt><dd>${esc(d.signerTitle)}</dd>
              <dt>ИИН</dt><dd class="mono">${maskIin(d.signerIin)}</dd>
              <dt>Организация</dt><dd>${esc(o.name)}<br><span class="mono muted">БИН ${o.bin}</span></dd>
              <dt>Сертификат</dt><dd>НУЦ РК (ГОСТ 34.10-2015)<br><span class="muted">действует до 14.06.2027</span></dd>
              <dt>Подписано</dt><dd class="num">${d.received.replace(/(\d\d):(\d\d)/, (m, h, mm) => h + ":" + String(+mm - 1).padStart(2, "0"))}</dd>
            </dl>
            <div class="checks">
              <div>${I.check}Цепочка до корневого сертификата НУЦ РК</div>
              <div>${I.check}Статус OCSP: действителен (good)</div>
              <div>${I.check}SHA-256 файла совпадает с подписанным</div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-h"><h3>Маршрут документа</h3></div>
            <div class="timeline" style="padding-top:14px">
              ${steps.map((s, i) => `<div class="tl ${s.bad ? "bad" : ""} ${i === steps.length - 1 ? "now" : ""}"><i></i><div><b>${s.t}</b><span>${esc(s.s)}</span></div></div>`).join("")}
            </div>
            ${!final && can.accept() ? `<div class="actions"><button class="btn seal" data-a="accept">${I.pen} Принять и подписать ЭЦП</button><button class="btn danger" data-a="reject">Отклонить</button></div>` : ""}
            ${!final && !can.accept() ? `<div class="actions"><div class="note">${I.info}<span>Принять или отклонить документ может только врач.</span></div></div>` : ""}
          </section>
          <section class="panel">
            <div class="panel-h"><h3>Сведения</h3><span class="muted" style="font-size:12px">FHIR DocumentReference</span></div>
            <dl class="kv">
              <dt>Пациент</dt><dd>${esc(d.patient)}<br><span class="mono muted">ИИН ${maskIin(d.iin)}</span></dd>
              <dt>Тип</dt><dd>${d.type}</dd>
              <dt>Отделение</dt><dd>${esc(d.dep)}</dd>
              <dt>Доступ до</dt><dd>${d.until}</dd>
              <dt>Согласие</dt><dd>Подтверждено отправителем</dd>
              <dt>SHA-256</dt><dd class="mono muted">${d.hash.slice(0, 32)}<br>${d.hash.slice(32)}</dd>
            </dl>
          </section>
        </aside>
      </div>`;
  }

  function paper(d, o) {
    const body = {
      "Выписной эпикриз": `<dl><dt>Находился на лечении</dt><dd>с 09.10.2026 по 22.10.2026 (13 койко-дней)</dd><dt>Основной диагноз</dt><dd>I11.9 Гипертензивная болезнь с преимущественным поражением сердца без застойной сердечной недостаточности</dd><dt>Сопутствующий</dt><dd>E11.9 Сахарный диабет 2 типа, компенсированный</dd></dl>
        <p><b>Проведено лечение:</b> бисопролол 5 мг, периндоприл 4 мг, аторвастатин 20 мг, метформин 1000 мг. На фоне терапии АД стабилизировалось на уровне 130/80 мм рт. ст.</p>
        <p><b>Результаты обследования:</b> ЭКГ — синусовый ритм, ЧСС 68 в мин., признаки гипертрофии левого желудочка. ЭхоКГ — ФВ 58 %, ТМЖП 12 мм. Гликированный гемоглобин 6,8 %.</p>
        <p><b>Рекомендации:</b> наблюдение терапевта по месту жительства, контроль АД ежедневно, контроль липидного спектра через 3 месяца, консультация эндокринолога.</p>`,
      default: `<dl><dt>Дата</dt><dd>${d.received.slice(0, 10)}</dd><dt>Вид документа</dt><dd>${d.type}</dd><dt>Направившая организация</dt><dd>${esc(o.name)}</dd></dl>
        <p>Содержимое документа показано схематично. В рабочей системе здесь отображается исходный PDF-файл, полученный от отправителя, без изменений.</p>
        <p>Документ сопровождается откреплённой CMS-подписью и описанием в формате HL7 FHIR R4 DocumentReference.</p>`
    };
    return `
      <article class="paper" aria-label="Предпросмотр документа">
        <div class="ph"><span>${esc(o.name)}<br>${esc(d.dep)}<br>г. ${o.city}</span><span style="text-align:right">БИН ${o.bin}<br>№ ${d.id}</span></div>
        <h4>${d.type.toUpperCase()}</h4>
        <div class="sub">из медицинской карты стационарного пациента</div>
        <dl><dt>Пациент</dt><dd>${esc(d.patient)}, ИИН ${maskIin(d.iin)}</dd></dl>
        ${body[d.type] || body.default}
        <div class="ps">
          <span>${esc(d.signerTitle)}<br><b>${esc(d.signer)}</b></span>
          <div class="stamp"><b>ПОДПИСАНО ЭЦП</b>${esc(d.signer.split(" ").slice(0, 2).join(" "))}<br>Серт. 4c1f…09a2 · НУЦ РК<br>${d.received}</div>
        </div>
      </article>`;
  }

  function compose() {
    if (!can.send()) return denied();
    const c = S.compose;
    const iinOk = /^\d{12}$/.test(c.iin);
    const step1ok = c.file && iinOk && c.patient.trim() && c.title.trim();
    const step2ok = !!c.org;
    const o = c.org && org(c.org);
    const stepCls = (n) => (c.step === n ? "on" : c.step > n ? "done" : "");
    let body = "";
    if (c.step === 1) {
      body = `
        <div class="panel-h"><h3>Файл и данные пациента</h3><span class="muted" style="font-size:12px">PDF, JPEG или PNG до 25 МБ</span></div>
        <div class="panel-b">
          ${c.file ? `<div class="file"><span class="doc-ico">PDF</span><div class="grow"><b style="font-weight:500">${c.file.name}</b><div class="muted" style="font-size:12.5px">${c.file.size} · 2 стр.</div><div class="hash">SHA-256 ${c.file.hash}</div></div><button class="btn sm ghost" data-a="file-remove" aria-label="Удалить файл">${I.x}</button></div>`
            : `<button class="drop" data-a="file-add">${I.upload}<b style="color:var(--ink);font-weight:500">Перетащите файл сюда или выберите на компьютере</b><span>Нажмите, чтобы добавить пример: «Направление_Сейтказиева.pdf»</span></button>`}
          <div class="grid2">
            <label class="field"><span>ИИН пациента</span><input class="input mono ${c.touched && !iinOk ? "invalid" : ""}" id="c-iin" inputmode="numeric" maxlength="12" placeholder="12 цифр" value="${esc(c.iin)}">${c.touched && !iinOk ? '<small class="err">ИИН должен состоять из 12 цифр</small>' : "<small>Используется для поиска документов пациента</small>"}</label>
            <label class="field"><span>ФИО пациента</span><input class="input" id="c-patient" placeholder="Фамилия И. О." value="${esc(c.patient)}"></label>
          </div>
          <div class="grid2">
            <label class="field"><span>Тип документа</span><select class="input" id="c-type">${TYPES.map((t) => `<option ${t === c.type ? "selected" : ""}>${t}</option>`).join("")}</select></label>
            <label class="field"><span>Название</span><input class="input" id="c-title" placeholder="Например: направление к кардиологу" value="${esc(c.title)}"></label>
          </div>
          <label class="field"><span>Комментарий для получателя <span class="muted">(необязательно)</span></span><textarea class="input" id="c-comment" rows="2" placeholder="Видно только получателю">${esc(c.comment)}</textarea></label>
          <div class="toolbar" style="justify-content:space-between"><button class="btn ghost" data-a="fill-sample">Заполнить примером</button><button class="btn primary" data-a="c-next" ${step1ok ? "" : "disabled"}>Далее: получатель</button></div>
        </div>`;
    } else if (c.step === 2) {
      const q = c.orgQuery.toLowerCase();
      body = `
        <div class="panel-h"><h3>Получатель</h3><span class="muted" style="font-size:12px">Справочник подключённых организаций</span></div>
        <div class="panel-b">
          <label class="search" style="max-width:none">${I.search}<input class="input" id="c-orgq" placeholder="Название, город или БИН" value="${esc(c.orgQuery)}"></label>
          <div class="org-list">${ORGS.filter((x) => !q || (x.name + x.city + x.bin).toLowerCase().includes(q)).map((x) => `
            <button class="org-opt ${c.org === x.id ? "on" : ""}" data-org="${x.id}"><span class="org-ico">${x.ini}</span><span class="grow"><b style="font-weight:500">${x.name}</b><small>${x.city} · БИН ${x.bin}</small></span>${c.org === x.id ? `<span style="color:var(--accent)">${I.check}</span>` : ""}</button>`).join("")}</div>
          ${o ? `<label class="field"><span>Отделение получателя</span><select class="input" id="c-dep"><option value="">Вся организация (канцелярия)</option>${o.deps.map((x) => `<option ${x === c.dep ? "selected" : ""}>${x}</option>`).join("")}</select></label>` : ""}
          <div class="field"><span>Срок доступа</span><div class="seg">${[7, 30, 90].map((n) => `<button class="chip ${c.days === n ? "on" : ""}" data-days="${n}">${n} дней</button>`).join("")}</div><small>После окончания срока получатель не сможет открыть файл. Доступ можно отозвать раньше.</small></div>
          <div class="toolbar" style="justify-content:space-between"><button class="btn" data-a="c-back">Назад</button><button class="btn primary" data-a="c-next" ${step2ok ? "" : "disabled"}>Далее: подпись</button></div>
        </div>`;
    } else {
      body = `
        <div class="panel-h"><h3>Подпись и отправка</h3></div>
        <div class="panel-b">
          <label class="consent" for="c-consent"><input type="checkbox" id="c-consent" ${c.consent ? "checked" : ""}><span><b>Согласие пациента на передачу документа получено</b><span>${esc(c.patient)} дал(а) согласие на передачу сведений в «${esc(o.name)}». Без подтверждения отправка невозможна.</span></span></label>
          <div class="note">${I.info}<span>Документ будет подписан вашей ЭЦП через NCALayer. Перед доставкой система проверит подпись и статус сертификата в НУЦ РК.</span></div>
          <div class="toolbar" style="justify-content:space-between"><button class="btn" data-a="c-back">Назад</button><button class="btn seal" data-a="c-sign" ${c.consent ? "" : "disabled"}>${I.pen} Подписать и отправить</button></div>
        </div>`;
    }
    return `
      <div class="page-head"><div><h1>Новый документ</h1><p>Подготовьте документ, выберите получателя и подпишите ЭЦП</p></div></div>
      <div class="steps"><div class="step ${stepCls(1)}"><i></i>Документ</div><div class="step ${stepCls(2)}"><i></i>Получатель</div><div class="step ${stepCls(3)}"><i></i>Подпись</div></div>
      <div class="compose">
        <section class="panel">${body}</section>
        <aside class="panel">
          <div class="panel-h"><h3>Сводка</h3></div>
          <div class="panel-b" style="gap:0">
            <div class="summary">
              <div><span>Файл</span><b>${c.file ? c.file.name : "—"}</b></div>
              <div><span>Пациент</span><b>${esc(c.patient) || "—"}</b></div>
              <div><span>ИИН</span><b class="mono">${iinOk ? maskIin(c.iin) : "—"}</b></div>
              <div><span>Тип</span><b>${c.type}</b></div>
              <div><span>Получатель</span><b>${o ? esc(o.name) : "—"}</b></div>
              <div><span>Отделение</span><b>${o ? esc(c.dep || "Канцелярия") : "—"}</b></div>
              <div><span>Доступ</span><b>${c.days} дней</b></div>
              <div><span>Отправитель</span><b>${PEOPLE[S.role].short}</b></div>
            </div>
          </div>
        </aside>
      </div>`;
  }

  function sentView() {
    if (!can.docs()) return denied();
    const f = S.sentFilter;
    const list = sent.filter((d) => (f === "all" ? true : f === "active" ? ["sent", "delivered", "opened"].includes(d.status) : f === "done" ? d.status === "signed" : ["revoked", "expired", "rejected"].includes(d.status))).filter(matchQ);
    const track = (st) => {
      if (st === "revoked" || st === "expired" || st === "rejected") return `<span class="track">${[0, 1, 2, 3].map((i) => `<i class="${i === 0 ? "on" : "bad"}"></i>`).join("")}</span>`;
      const n = ORDER.indexOf(st);
      return `<span class="track">${ORDER.map((_, i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
    };
    const rows = list.map((d) => `
      <tr ${d.fresh ? 'class="unread"' : ""}>
        <td><div class="doc-cell"><span class="doc-ico">PDF</span><div style="min-width:0"><span class="doc-title">${esc(d.title)}</span><span class="doc-sub">${d.type} · <span class="mono">${d.id}</span></span></div></div></td>
        <td class="nw"><div>${esc(d.patient)}</div><div class="mono muted">${maskIin(d.iin)}</div></td>
        <td><div>${esc(org(d.to).name)}</div><div class="doc-sub">${esc(d.dep || "Канцелярия")}</div></td>
        <td class="num nw">${d.sentAt}<div class="doc-sub">${PEOPLE[d.by].short}</div></td>
        <td><div style="display:grid;gap:6px">${pill(d.status)}${track(d.status)}</div></td>
        <td class="num">${d.status === "revoked" ? "—" : d.until}</td>
        <td>${["sent", "delivered", "opened"].includes(d.status) ? `<button class="btn sm danger" data-revoke="${d.id}" title="Отозвать доступ" aria-label="Отозвать доступ к ${d.id}">${I.revoke}</button>` : ""}</td>
      </tr>`).join("");
    return `
      <div class="page-head"><div><h1>Отправленные документы</h1><p>Статус доставки и доступ к документам, отправленным вашей организацией</p></div>
        <button class="btn primary" data-go="compose">${I.plus} Новый документ</button></div>
      <section class="panel">
        <div class="panel-h"><div class="toolbar">
          ${[["all", "Все"], ["active", "В пути"], ["done", "Приняты"], ["closed", "Отозваны и истёкшие"]].map(([k, l]) => `<button class="chip ${f === k ? "on" : ""}" data-sfilter="${k}">${l}</button>`).join("")}
        </div><span class="muted" style="font-size:12.5px">Отправлено → Доставлено → Открыто → Принято</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Документ</th><th>Пациент</th><th>Получатель</th><th>Отправлен</th><th>Статус</th><th>Доступ до</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>${rows ? "" : `<div class="empty">Нет документов с таким статусом.</div>`}</div>
        <div class="table-foot"><span>Показано ${list.length} из ${sent.length}</span><span>Отзыв доступа записывается в журнал аудита</span></div>
      </section>`;
  }

  function usersView() {
    if (!can.users()) return denied();
    const rows = users.map((u, i) => `
      <tr style="cursor:default">
        <td><div class="doc-cell"><span class="avatar">${u.name.split(" ").slice(0, 2).map((w) => w[0]).join("")}</span><div style="min-width:0"><span class="doc-title" style="${u.active ? "" : "color:var(--muted)"}">${esc(u.name)}</span><span class="doc-sub">${esc(u.title)}</span></div></div></td>
        <td class="mono nw" style="font-size:12.5px">${u.email}</td>
        <td><select class="input" data-role-of="${i}" style="height:32px;width:auto" ${u.active ? "" : "disabled"} aria-label="Роль">${Object.keys(ROLES).map((r) => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLES[r].label}</option>`).join("")}</select></td>
        <td class="nw" style="${/Отозван|не привязан/.test(u.eds) ? "color:var(--bad)" : ""}">${u.eds}</td>
        <td class="num">${u.last}</td>
        <td><button class="switch ${u.active ? "on" : ""}" data-toggle-user="${i}" aria-label="${u.active ? "Деактивировать" : "Активировать"}"></button></td>
      </tr>`).join("");
    const by = (r) => users.filter((u) => u.role === r && u.active).length;
    return `
      <div class="page-head"><div><h1>Пользователи и роли</h1><p>${ME_ORG.name} · ${users.filter((u) => u.active).length} активных пользователей</p></div>
        <button class="btn primary" data-a="invite">${I.plus} Пригласить пользователя</button></div>
      <div class="stats">
        <div class="stat"><span>Врачи</span><b>${by("doc")}</b><small>отправка, приём, подпись</small></div>
        <div class="stat"><span>Регистраторы</span><b>${by("reg")}</b><small>отправка и маршрутизация</small></div>
        <div class="stat"><span>Администраторы</span><b>${by("adm")}</b><small>пользователи и роли</small></div>
        <div class="stat"><span>Специалисты ИБ</span><b>${by("sec")}</b><small>журнал аудита</small></div>

  // ---------- Overlays ----------
  function overlay() {
    const o = S.overlay;
    if (o.type === "notifs") return `
      <div class="drawer" role="dialog" aria-label="Уведомления">
        <div class="drawer-h"><b>Уведомления</b><button class="btn sm ghost" data-a="read-all">Прочитать все</button></div>
        ${notifs.map((n, i) => `<div class="notif ${n.read ? "read" : ""}" data-notif="${i}"><i></i><div><b>${n.t}</b><span>${n.s}</span></div></div>`).join("")}
      </div>`;
    if (o.type === "menu") return `
      <div class="menu" role="menu">
        <div style="padding:8px 10px"><b style="font-weight:500">${PEOPLE[S.role].name}</b><div class="muted" style="font-size:12.5px">${PEOPLE[S.role].title}</div></div>

        ${Object.keys(ROLES).map((r) => `<button class="${S.role === r ? "on" : ""}" data-role="${r}"><span class="role ${ROLES[r].cls}">${ROLES[r].label}</span>${PEOPLE[r].short}</button>`).join("")}
        <hr><button data-a="theme">${I.moon} Сменить тему</button><button data-a="logout">${I.logout} Выйти</button>
      </div>`;
    let inner = "";
    if (o.type === "ncl-off") {
      inner = `
        <div class="modal-h ncl-head"><span class="ncl-logo">NCA</span><h3>NCALayer не отвечает<small>Подписание невозможно без NCALayer</small></h3><button class="btn sm ghost" data-a="close" style="color:#fff" aria-label="Закрыть">${I.x}</button></div>
        <div class="modal-b">
          <div class="note bad">${I.warn}<span>Браузер не смог подключиться к NCALayer на этом компьютере.</span></div>
          <ol style="margin:0;padding-left:20px;display:grid;gap:6px">
            <li>Запустите NCALayer: значок должен появиться в области уведомлений.</li>
            <li>Если NCALayer не установлен, установите его с сайта НУЦ РК (pki.gov.kz).</li>
            <li>Если NCALayer запущен, перезапустите его и обновите страницу.</li>
          </ol>
          ${o.retried ? `<div class="note warn">${I.info}<span>NCALayer всё ещё не отвечает.</span></div>` : ""}
        </div>
        <div class="modal-f"><button class="btn" data-a="close">Отмена</button><button class="btn primary" data-a="ncl-retry">Проверить снова</button></div>`;
    } else if (o.type === "ncl") {
      const stages = ["Подписание в NCALayer", "Проверка подписи и цепочки сертификатов", "Проверка статуса сертификата (OCSP НУЦ РК)", o.mode === "send" ? "Доставка получателю" : "Сохранение подписи получателя"];
      const nm = PEOPLE[S.role].name.toUpperCase();
      const certs = [
        `<b>${nm}</b><span>Подписание (GOST 34.10-2015) · ИИН ${maskIin(PEOPLE[S.role].iin)}</span><span>${ME_ORG.name} · действует до 14.03.2027</span>`,
        `<b>${nm}</b><span>Аутентификация (AUTH_GOST) · только для входа</span>`,
        `<b>${nm}</b><span>Подписание (RSA) · ИИН ${maskIin(PEOPLE[S.role].iin)}</span><span>Старый ключ · действует до 20.05.2027</span>`
      ];
      const icon = (i) => (o.failed && i === o.stage ? `<span style="color:var(--bad);display:flex">${I.x}</span>` : i < o.stage ? I.check : i === o.stage ? '<span class="spin"></span>' : '<span style="width:18px"></span>');
      const cls = (i) => (o.failed && i === o.stage ? 'style="color:var(--bad)"' : i < o.stage ? 'class="done"' : "");
      inner = `
        <div class="modal-h ncl-head"><span class="ncl-logo">NCA</span><h3>NCALayer<small>Подписание: ${o.mode === "send" ? "отправка документа" : "подтверждение получения"}</small></h3>${o.stage < 0 || o.failed ? `<button class="btn sm ghost" data-a="close" style="color:#fff" aria-label="Закрыть">${I.x}</button>` : ""}</div>
        <div class="modal-b">
          ${o.stage < 0 ? `
            <div class="field"><span>Ключ</span>
              ${certs.map((c, i) => `<label class="cert ${o.cert === i ? "on" : ""}"><input type="radio" name="cert" value="${i}" ${o.cert === i ? "checked" : ""}><span>${c}</span></label>`).join("")}
              ${o.cert === 1 ? '<small class="err">Ключ аутентификации нельзя использовать для подписи. Выберите ключ «Подписание».</small>' : ""}
            </div>
            <label class="field"><span>Пароль от хранилища ключа</span><input class="input ${o.err ? "invalid" : ""}" type="password" id="ncl-pass" value="${esc(o.pass)}">${o.err ? `<small class="err">${o.err}</small>` : "<small>Для демонстрации ошибки введите 0000</small>"}</label>
            <div class="note">${I.lock}<span>Пароль и закрытый ключ обрабатываются только NCALayer на вашем компьютере.</span></div>`
          : `<div class="progress">${stages.map((s, i) => `<div ${cls(i)}>${icon(i)}${s}</div>`).join("")}</div>
            ${o.failed ? `<div class="note bad">${I.shieldX}<span><b>Сертификат отозван НУЦ РК 01.10.2026.</b> ${o.mode === "send" ? "Документ не отправлен" : "Получение не подтверждено"}, событие записано в журнал аудита. Подпишите действующим ключом или обратитесь в НУЦ РК за новым сертификатом.</span></div>` : ""}`}
        </div>
        ${o.stage < 0 ? `<div class="modal-f"><button class="btn" data-a="close">Отмена</button><button class="btn seal" data-a="ncl-go" ${o.cert === 1 ? "disabled" : ""}>${I.pen} Подписать</button></div>` : ""}
        ${o.failed ? `<div class="modal-f"><button class="btn" data-a="close">Закрыть</button><button class="btn primary" data-a="ncl-again">Выбрать другой ключ</button></div>` : ""}`;
    } else if (o.type === "reject") {
      inner = `
        <div class="modal-h"><h3>Отклонить документ</h3><button class="btn sm ghost" data-a="close" aria-label="Закрыть">${I.x}</button></div>
        <div class="modal-b">
          <p style="margin:0" class="muted">Отправитель увидит причину. Документ останется в журнале со статусом «Отклонён».</p>
          <div class="seg">${["Не тот пациент", "Неполные данные", "Не наш профиль", "Нечитаемый файл"].map((r) => `<button class="chip" data-reason="${r}">${r}</button>`).join("")}</div>
          <label class="field"><span>Причина</span><textarea class="input" id="rj-reason" rows="3" placeholder="Обязательное поле">${esc(o.reason || "")}</textarea>${o.err ? '<small class="err">Укажите причину отклонения</small>' : ""}</label>
        </div>
        <div class="modal-f"><button class="btn" data-a="close">Отмена</button><button class="btn" style="background:var(--bad);border-color:var(--bad);color:#fff" data-a="reject-go">Отклонить</button></div>`;
    } else if (o.type === "revoke") {
      const d = sent.find((x) => x.id === o.id);
      inner = `
        <div class="modal-h"><h3>Отозвать доступ?</h3><button class="btn sm ghost" data-a="close" aria-label="Закрыть">${I.x}</button></div>
        <div class="modal-b"><p style="margin:0">«${esc(org(d.to).name)}» больше не сможет открыть документ <span class="mono">${d.id}</span> (${esc(d.title)}). Отменить отзыв нельзя: при необходимости документ нужно отправить заново.</p></div>
        <div class="modal-f"><button class="btn" data-a="close">Отмена</button><button class="btn" style="background:var(--bad);border-color:var(--bad);color:#fff" data-a="revoke-go">Отозвать доступ</button></div>`;
    } else if (o.type === "invite") {
      inner = `
        <div class="modal-h"><h3>Пригласить пользователя</h3><button class="btn sm ghost" data-a="close" aria-label="Закрыть">${I.x}</button></div>
        <div class="modal-b">
          <label class="field"><span>ФИО</span><input class="input" id="inv-name" placeholder="Фамилия Имя Отчество"></label>
          <label class="field"><span>Рабочий e-mail</span><input class="input" id="inv-email" placeholder="name@samal-clinic.kz"></label>
          <label class="field"><span>Роль</span><select class="input" id="inv-role">${Object.keys(ROLES).map((r) => `<option value="${r}">${ROLES[r].label}</option>`).join("")}</select></label>
          <div class="note">${I.info}<span>Пользователь получит ссылку для установки пароля и TOTP. Сертификат ЭЦП привязывается при первой подписи.</span></div>
        </div>
        <div class="modal-f"><button class="btn" data-a="close">Отмена</button><button class="btn primary" data-a="invite-go">Отправить приглашение</button></div>`;
    }
    return `<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
  }
  function closeOverlay(silent) { S.overlay = null; if (!silent) render(); }

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = I.check + "<span>" + msg + "</span>";
    document.getElementById("toasts").appendChild(t);
    setTimeout(() => t.remove(), 3600);
  }

  // ---------- NCALayer simulation ----------
  function nclDialog(mode, id) {
    S.overlay = S.ncl ? { type: "ncl", mode, id, stage: -1, cert: 0, pass: "••••••••" } : { type: "ncl-off", mode, id };
    render();
  }
  function runSigning(done) {
    const o = S.overlay;
    o.stage = 0; o.failed = false;
    render();
    const tick = () => {
      if (S.overlay !== o) return;
      o.stage++;
      // A revoked certificate fails at the OCSP check (FR-08).
      if (o.cert === 2 && o.stage === 2) {
        setTimeout(() => {
          if (S.overlay !== o) return;
          o.failed = true;
          audit.unshift({ t: "23.10.2026 09:20:05", who: "Система", act: "Подпись отклонена: сертификат отозван", kind: "bad", obj: o.mode === "send" ? "Новый документ (не отправлен)" : o.id, ip: "—", h: "d41c…77b2" });
          render();
        }, 900);
        return render();
      }
      render();
      if (o.stage < 4) setTimeout(tick, 650);
      else setTimeout(() => { S.overlay = null; done(); }, 450);
    };
    setTimeout(tick, 800);
  }
  function now() {
    const d = new Date(2026, 9, 23, 9, 20);
    return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a],[data-go],[data-filter],[data-sfilter],[data-org],[data-days],[data-role],[data-notif],[data-revoke],[data-toggle-user],[data-reason]");
    if (!el) {
      if (S.overlay && (S.overlay.type === "notifs" || S.overlay.type === "menu")) closeOverlay();
      return;
    }
    const a = el.dataset.a;
    if (a === "scrim" && e.target !== el) return;
    if (el.dataset.go) return go(el.dataset.go);
    if (el.dataset.filter) { S.filter = el.dataset.filter; return render(); }
    if (el.dataset.sfilter) { S.sentFilter = el.dataset.sfilter; return render(); }
    if (el.dataset.org) { S.compose.org = el.dataset.org; S.compose.dep = ""; return render(); }
    if (el.dataset.days) { S.compose.days = +el.dataset.days; return render(); }
    if (el.dataset.reason) { S.overlay.reason = el.dataset.reason; S.overlay.err = false; return render(); }
    if (el.dataset.role) {
      S.role = el.dataset.role; S.overlay = null;
      const v = S.view === "doc" ? "inbox" : S.view;
      const ok = { inbox: can.docs(), sent: can.docs(), compose: can.send(), users: can.users(), audit: can.audit() }[v];
      toast("Вы вошли как: " + ROLES[S.role].label);
      return go(ok ? v : home());
    }
    if (el.dataset.notif) { const n = notifs[+el.dataset.notif]; n.read = true; S.overlay = null; return go(n.go); }
    if (el.dataset.revoke) { S.overlay = { type: "revoke", id: el.dataset.revoke }; return render(); }
    if (el.dataset.toggleUser) {
      const u = users[+el.dataset.toggleUser]; u.active = !u.active;
      audit.unshift({ t: "23.10.2026 09:21:" + String(10 + audit.length).slice(-2), who: PEOPLE[S.role].short, act: u.active ? "Пользователь активирован" : "Пользователь деактивирован", kind: u.active ? "" : "warn", obj: u.email.split("@")[0], ip: "10.12.4.12", h: "e2" + Math.random().toString(16).slice(2, 4) + "…" + Math.random().toString(16).slice(2, 6) });
      toast(u.active ? "Доступ восстановлен: " + u.name : "Доступ закрыт: " + u.name + ". Активные сессии завершены.");
      return render();
    }
    switch (a) {
      case "tab-pwd": S.loginTab = "pwd"; return render();
      case "tab-eds": S.loginTab = "eds"; return render();
      case "login-next": S.loginStep = 2; return render();
      case "login-back": S.loginStep = 1; return render();
      case "login-done": S.authed = true; S.role = "doc"; return go("inbox");
      case "login-eds": S.authed = true; S.role = "doc"; toast("Вход выполнен по ЭЦП"); return go("inbox");
      case "logout": S.authed = false; S.loginStep = 1; S.loginTab = "pwd"; S.overlay = null; S.compose = null; try { history.replaceState(null, "", "#login"); } catch (err) {} return render();
      case "notifs": S.overlay = S.overlay && S.overlay.type === "notifs" ? null : { type: "notifs" }; return render();
      case "menu": S.overlay = S.overlay && S.overlay.type === "menu" ? null : { type: "menu" }; return render();
      case "read-all": notifs.forEach((n) => (n.read = true)); return render();
      case "theme": {
        const r = document.documentElement;
        const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        r.dataset.theme = dark ? "light" : "dark"; S.overlay = null; return render();
      }
      case "close": case "scrim": return closeOverlay();
      case "dl": return toast("Скачивание: " + el.dataset.what + " (в прототипе файл не создаётся)");
      case "accept": return nclDialog("accept", S.docId);
      case "ncl-toggle": S.ncl = !S.ncl; toast(S.ncl ? "NCALayer подключён" : "NCALayer отключён (демонстрация ошибки)"); return render();
      case "ncl-retry": {
        const o = S.overlay;
        if (!o.retried) { o.retried = true; return render(); }
        S.ncl = true; return nclDialog(o.mode, o.id);
      }
      case "ncl-again": Object.assign(S.overlay, { stage: -1, failed: false, cert: 0 }); return render();
      case "ncl-go": {
        const o = S.overlay;
        if (!o.pass) { o.err = "Введите пароль от хранилища ключа"; return render(); }
        if (o.pass === "0000") { o.err = "Неверный пароль. После 3 неудачных попыток хранилище будет заблокировано."; o.pass = ""; return render(); }
        o.err = null;
        if (o.mode === "accept") {
          return runSigning(() => {
            const d = incoming.find((x) => x.id === o.id); d.status = "signed"; d.acceptedNow = true;
            audit.unshift({ t: "23.10.2026 09:20:41", who: PEOPLE[S.role].short, act: "Получение подтверждено подписью ЭЦП", kind: "seal", obj: d.id, ip: "10.12.4.27", h: "5b3a…d0e9" });
            render(); toast("Документ принят. Отправитель получил подтверждение.");
          });
        }
        return runSigning(() => {
          const c = S.compose;
          const id = nextId();
          sent.unshift({ id, type: c.type, title: c.title, patient: c.patient, iin: c.iin, to: c.org, dep: c.dep, sentAt: now(), status: "delivered", until: c.days === 7 ? "30.10.2026" : c.days === 30 ? "22.11.2026" : "21.01.2027", by: S.role, fresh: true });
          audit.unshift({ t: "23.10.2026 09:20:12", who: PEOPLE[S.role].short, act: "Документ подписан и отправлен", kind: "seal", obj: id + " → " + org(c.org).name.replace(/^.*?«/, "«"), ip: "10.12.4.27", h: "8e41…c27a" });
          S.compose = null; S.sentFilter = "all";
          go("sent"); toast("Документ " + id + " подписан и доставлен в «" + org(sent[0].to).name.replace(/^.*?«|»$/g, "") + "»");
        });
      }
      case "reject": S.overlay = { type: "reject", reason: "" }; return render();
      case "reject-go": {
        const reason = (document.getElementById("rj-reason") || {}).value || "";
        if (!reason.trim()) { S.overlay.err = true; return render(); }
        const d = incoming.find((x) => x.id === S.docId); d.status = "rejected"; d.reason = reason.trim();
        audit.unshift({ t: "23.10.2026 09:20:30", who: PEOPLE[S.role].short, act: "Документ отклонён", kind: "warn", obj: d.id, ip: "10.12.4.27", h: "2fd8…91b4" });
        S.overlay = null; render(); return toast("Документ отклонён. Отправитель увидит причину.");
      }
      case "revoke-go": {
        const d = sent.find((x) => x.id === S.overlay.id); d.status = "revoked";
        audit.unshift({ t: "23.10.2026 09:20:55", who: PEOPLE[S.role].short, act: "Доступ к документу отозван", kind: "bad", obj: d.id, ip: "10.12.4.27", h: "c90e…4f17" });
        S.overlay = null; render(); return toast("Доступ к " + d.id + " отозван");
      }
      case "invite": S.overlay = { type: "invite" }; return render();
      case "invite-go": {
        const name = document.getElementById("inv-name").value.trim() || "Новый сотрудник";
        const email = document.getElementById("inv-email").value.trim() || "new.user@samal-clinic.kz";
        const role = document.getElementById("inv-role").value;
        users.push({ name, title: ROLES[role].label, role, email, eds: "Ключ не привязан", last: "Приглашение отправлено", active: true, invited: true });
        S.overlay = null; render(); return toast("Приглашение отправлено на " + email);
      }
      case "verify-chain": S.auditCheck = "run"; render(); return setTimeout(() => { S.auditCheck = "ok"; if (S.view === "audit") render(); }, 1400);
      case "export": return toast("Экспорт: audit_2026-10-22_2026-10-23.csv (в прототипе файл не создаётся)");
      case "file-add": S.compose.file = { name: "Направление_Сейтказиева.pdf", size: "218 КБ", hash: "6e0b3f…a41c9d (вычисляется в браузере)" }; return render();
      case "file-remove": S.compose.file = null; return render();
      case "fill-sample": Object.assign(S.compose, { file: S.compose.file || { name: "Направление_Сейтказиева.pdf", size: "218 КБ", hash: "6e0b3f…a41c9d (вычисляется в браузере)" }, iin: "540318450127", patient: "Сейтказиева Г. А.", type: "Направление на консультацию", title: "Направление к эндокринологу", touched: true }); return render();
      case "c-next": S.compose.step++; return render();
      case "c-back": S.compose.step--; return render();
      case "c-sign": return nclDialog("send");
    }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "q") {
      S.query = t.value;
      if (!["inbox", "sent"].includes(S.view)) S.view = can.docs() ? "inbox" : S.view;
      const pos = t.selectionStart; render();
      const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos);
      return;
    }
    if (t.id === "ncl-pass" && S.overlay) { S.overlay.pass = t.value; return; }
    if (!S.compose) return;
    const map = { "c-iin": "iin", "c-patient": "patient", "c-title": "title", "c-comment": "comment", "c-orgq": "orgQuery" };
    if (map[t.id]) {
      S.compose[map[t.id]] = t.id === "c-iin" ? t.value.replace(/\D/g, "") : t.value;
      if (t.id === "c-iin") S.compose.touched = t.value.length >= 12 || S.compose.touched;
      if (t.id === "c-comment") return;
      const pos = t.selectionStart; render();
      const n = document.getElementById(t.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "c-type") S.compose.type = t.value;
    else if (t.id === "c-dep") S.compose.dep = t.value;
    else if (t.id === "c-consent") S.compose.consent = t.checked;
    else if (t.id === "c-iin") S.compose.touched = true;
    else if (t.name === "cert" && S.overlay) { S.overlay.cert = +t.value; S.overlay.err = null; }
    else if (t.dataset.roleOf) {
      const u = users[+t.dataset.roleOf]; u.role = t.value;
      audit.unshift({ t: "23.10.2026 09:21:30", who: PEOPLE[S.role].short, act: "Роль изменена", kind: "", obj: u.email.split("@")[0] + " → " + ROLES[u.role].label, ip: "10.12.4.12", h: "77ac…0b5e" });
      toast("Роль изменена: " + u.name + " — " + ROLES[u.role].label);
    } else return;
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && S.overlay && !(S.overlay.type === "ncl" && S.overlay.stage >= 0 && !S.overlay.failed)) closeOverlay();
    if (e.key === "Enter" && e.target.id === "rj-reason" && !e.shiftKey) { e.preventDefault(); }
  });

  // ---------- Start: open the view named in the hash (used for screenshots and direct links) ----------
  const h = (location.hash || "").slice(1);
  const presets = {
    login: () => {},
    totp: () => { S.loginStep = 2; },
    inbox: () => { S.authed = true; S.view = "inbox"; },
    sent: () => { S.authed = true; S.view = "sent"; },
    compose: () => { S.authed = true; S.view = "compose"; S.compose = freshCompose(); },
    "compose-sign": () => { S.authed = true; S.view = "compose"; S.compose = Object.assign(freshCompose(), { step: 3, file: { name: "Направление_Сейтказиева.pdf", size: "218 КБ", hash: "6e0b3f…a41c9d" }, iin: "540318450127", patient: "Сейтказиева Г. А.", type: "Направление на консультацию", title: "Направление к эндокринологу", org: "o1", dep: "Консультативно-диагностический отдел", consent: true }); S.overlay = { type: "ncl", mode: "send", stage: -1, cert: 0, pass: "••••••••" }; },
    "ncl-off": () => { presets["compose-sign"](); S.ncl = false; S.overlay = { type: "ncl-off", mode: "send" }; },
    "sign-revoked": () => { presets["compose-sign"](); Object.assign(S.overlay, { cert: 2, stage: 2, failed: true }); },
    users: () => { S.authed = true; S.role = "adm"; S.view = "users"; },
    audit: () => { S.authed = true; S.role = "sec"; S.view = "audit"; S.auditCheck = "ok"; }
  };
  if (presets[h]) presets[h]();
  else if (h.startsWith("doc-")) { S.authed = true; go("doc/" + h.slice(4)); }
  render();
})();
</script>
</body>
</html>
